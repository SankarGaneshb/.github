name: 🐛 Bug Report
description: Report an issue or unexpected behavior in this project
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: input
    id: environment
    attributes:
      label: OS & Environment
      description: What operating system, runtime version, or environment are you using?
      placeholder: Ubuntu 24.04 (x86_64) / macOS Sonoma / Windows 11 / Node 20 / Python 3.12 / .NET 8
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Terminal output, stack traces, or screenshots.
      render: shell
